      - name: Build debug APK
        working-directory: ${{ runner.temp }}/DepthClock
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp "$RUNNER_TEMP/DepthClock/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/DepthClock.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DepthClock-apk
          path: DepthClock.apk

      - name: Publish release (easy download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" DepthClock.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Depth Clock build ${{ github.run_number }}" \
            --notes "Debug-signed APK. Download DepthClock.apk below, then open it to install."
